services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: invoice_agent
      POSTGRES_PASSWORD: invoice_agent
      POSTGRES_DB: invoice_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first creation of the volume above. On an existing volume
      # the eval database has to be created by hand -- see README-eval-db.md.
      - ./initdb:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
